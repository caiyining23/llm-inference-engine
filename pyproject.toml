[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-inference-engine-demo"
version = "0.1.0"
description = "Tested educational continuous-batching inference scheduler"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
model = ["torch>=2.2", "transformers>=4.45", "accelerate>=0.28"]

[tool.setuptools.packages.find]
where = ["src"]
